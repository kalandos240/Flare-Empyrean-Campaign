name: Deliver latest built APK as portable chunks

on:
  workflow_dispatch:
  push:
    branches:
      - port/rustore-android-foundation
    paths:
      - '.github/workflows/apk-delivery.yml'

permissions:
  contents: read
  actions: read

jobs:
  export-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download already-built APK from successful Android run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flare-existing-artifact"
          gh run download 38309469819 \
            --repo ${{ github.repository }} \
            --name flare-empyrean-android-unsigned \
            --dir "$RUNNER_TEMP/flare-existing-artifact"
          APK="$(find "$RUNNER_TEMP/flare-existing-artifact" -name 'app-debug.apk' -type f -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo 'Previously compiled APK is missing' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/flare-apk-delivery"
          cp "$APK" "$RUNNER_TEMP/flare-apk-delivery/flare-empyrean-0.2.0-debug.apk"
          cd "$RUNNER_TEMP/flare-apk-delivery"
          sha256sum flare-empyrean-0.2.0-debug.apk > flare-empyrean-0.2.0-debug.apk.sha256
          split -b 400m -d -a 2 flare-empyrean-0.2.0-debug.apk flare-empyrean-0.2.0-debug.apk.part.
          echo "Source APK size: $(stat -c '%s' flare-empyrean-0.2.0-debug.apk) bytes"
          ls -lh flare-empyrean-0.2.0-debug.apk.part.*
          if [[ "$(find . -name '*.part.*' -type f | wc -l)" -ne 2 ]]; then
            echo "Unexpected APK size; expected precisely 2 <=400MiB chunks" >&2
            exit 1
          fi

      - name: Upload APK first part
        uses: actions/upload-artifact@v4
        with:
          name: flare-0.2.0-apk-part-00
          path: ${{ runner.temp }}/flare-apk-delivery/flare-empyrean-0.2.0-debug.apk.part.00
          retention-days: 7
          compression-level: 0

      - name: Upload APK second part
        uses: actions/upload-artifact@v4
        with:
          name: flare-0.2.0-apk-part-01
          path: ${{ runner.temp }}/flare-apk-delivery/flare-empyrean-0.2.0-debug.apk.part.01
          retention-days: 7
          compression-level: 0

      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with:
          name: flare-0.2.0-apk-sha256
          path: ${{ runner.temp }}/flare-apk-delivery/flare-empyrean-0.2.0-debug.apk.sha256
          retention-days: 7
